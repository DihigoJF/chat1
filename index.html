<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Chat Real</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<div class="login">

    <h1>Chat</h1>

    <input
        id="username"
        placeholder="Tu nombre"
    >

    <button id="loginButton">
        Entrar
    </button>

</div>


<div
    id="chat"
    class="chat hidden"
>

    <header>

        <div>

            <strong id="receiverName">
                Persona B
            </strong>

            <span id="status">
                Desconectado
            </span>

        </div>

    </header>


    <main id="messages">
    </main>


    <div
        id="typing"
        class="typing">
    </div>


    <footer>

        <input
            id="messageInput"
            placeholder="Escribe un mensaje..."
        >

        <button id="sendButton">
            Enviar
        </button>

    </footer>

</div>


<script src="app.js"></script>

</body>

</html>
