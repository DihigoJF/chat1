<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Chat</title>

<style>

:root {
    --bg: #0b0f14;
    --panel: #11161d;
    --panel-2: #171d26;
    --panel-3: #202733;
    --border: rgba(255,255,255,.08);

    --text: #f4f7fb;
    --muted: #8d98a8;

    --primary: #4f8cff;
    --primary-dark: #326dd8;

    --bubble-a: #202733;
    --bubble-b: linear-gradient(135deg,#4d8dff,#356fda);

    --danger: #ff5d6c;
    --success: #3ddc97;
    --warning: #ffc857;

    --shadow: 0 20px 60px rgba(0,0,0,.35);

    --radius: 18px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #1b2432,
            #090d12 60%
        );

    color: var(--text);

    height: 100vh;

    overflow: hidden;
}

/* =========================================
   APP
========================================= */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
}

/* =========================================
   SIDEBAR
========================================= */

.sidebar {
    width: 320px;

    background: rgba(17,22,29,.96);

    border-right: 1px solid var(--border);

    display: flex;
    flex-direction: column;
}

.sidebar-header {
    padding: 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}

.logo {
    font-weight: 700;
    font-size: 18px;
}

.online-status {
    display: flex;
    align-items: center;
    gap: 7px;

    color: var(--muted);

    font-size: 12px;
}

.online-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--success);

    box-shadow:
        0 0 10px var(--success);
}

/* Search */

.search {
    margin: 15px;
    position: relative;
}

.search input {
    width: 100%;

    background: var(--panel-2);

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 12px 14px 12px 40px;

    color: white;

    outline: none;
}

.search-icon {
    position: absolute;
    left: 14px;
    top: 11px;

    opacity: .5;
}

/* User switcher */

.user-switcher {
    padding: 0 15px 15px;
}

.user-switcher select {

    width: 100%;

    background: var(--panel-2);

    border: 1px solid var(--border);

    border-radius: 10px;

    color: white;

    padding: 10px;

    outline: none;
}

/* Contact */

.contact {

    margin: 0 10px;

    padding: 14px;

    border-radius: 14px;

    background: rgba(255,255,255,.03);

    display: flex;

    align-items: center;

    gap: 12px;

    cursor: pointer;

    transition: .2s;
}

.contact:hover {
    background: rgba(255,255,255,.07);
}

.avatar {

    width: 44px;
    height: 44px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #5f9cff,
            #7a4dff
        );

    position: relative;
}

.avatar.online::after {

    content: "";

    position: absolute;

    right: 0;
    bottom: 0;

    width: 11px;
    height: 11px;

    background: var(--success);

    border: 2px solid var(--panel);

    border-radius: 50%;
}

.contact-info {
    flex: 1;
}

.contact-name {
    font-weight: 600;
}

.contact-last {
    margin-top: 3px;

    font-size: 12px;

    color: var(--muted);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* =========================================
   MAIN
========================================= */

.chat {

    flex: 1;

    display: flex;
    flex-direction: column;

    min-width: 0;
}

/* Header */

.chat-header {

    height: 72px;

    background: rgba(17,22,29,.9);

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    backdrop-filter: blur(20px);
}

.chat-user {

    display: flex;
    gap: 12px;
    align-items: center;
}

.chat-user-info h3 {
    font-size: 15px;
}

.chat-user-info span {
    color: var(--success);

    font-size: 12px;
}

.header-actions {

    display: flex;
    gap: 8px;
}

.icon-button {

    width: 38px;
    height: 38px;

    border-radius: 10px;

    border: 1px solid var(--border);

    background: var(--panel-2);

    color: white;

    cursor: pointer;

    transition: .2s;
}

.icon-button:hover {
    background: var(--panel-3);
}

/* =========================================
   MESSAGES
========================================= */

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 25px;

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.messages::-webkit-scrollbar {
    width: 5px;
}

.messages::-webkit-scrollbar-thumb {
    background: #303844;
    border-radius: 10px;
}

/* Date */

.date-divider {

    display: flex;

    justify-content: center;

    margin: 15px 0;

}

.date-divider span {

    background: var(--panel-2);

    color: var(--muted);

    border: 1px solid var(--border);

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 11px;
}

/* Message */

.message-row {

    display: flex;

    width: 100%;
}

.message-row.me {
    justify-content: flex-end;
}

.message {

    max-width: min(70%, 650px);

    position: relative;
}

.bubble {

    padding: 11px 14px;

    border-radius: 17px;

    line-height: 1.45;

    font-size: 14px;

    word-wrap: break-word;

    position: relative;
}

.message-row.them .bubble {

    background: var(--bubble-a);

    border-bottom-left-radius: 5px;
}

.message-row.me .bubble {

    background: var(--bubble-b);

    border-bottom-right-radius: 5px;

    box-shadow:
        0 5px 20px rgba(50,100,200,.15);
}

/* Reply */

.reply-preview {

    border-left: 3px solid rgba(255,255,255,.6);

    background: rgba(0,0,0,.15);

    padding: 7px 10px;

    margin-bottom: 7px;

    border-radius: 5px;

    font-size: 12px;
}

.reply-author {
    font-weight: 600;
    margin-bottom: 2px;
}

.reply-text {
    opacity: .75;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* Meta */

.message-meta {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 5px;

    margin-top: 4px;

    font-size: 10px;

    opacity: .65;
}

.read-status {
    letter-spacing: -2px;
}

.read-status.read {
    color: #b9dcff;
}

/* Message actions */

.message-actions {

    position: absolute;

    top: -15px;

    right: 5px;

    display: none;

    background: var(--panel-3);

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 4px;

    box-shadow: var(--shadow);

    z-index: 10;
}

.message:hover .message-actions {
    display: flex;
}

.action {

    border: none;

    background: transparent;

    color: white;

    width: 28px;
    height: 28px;

    border-radius: 6px;

    cursor: pointer;
}

.action:hover {
    background: rgba(255,255,255,.1);
}

/* =========================================
   TYPING
========================================= */

.typing {

    min-height: 25px;

    padding-left: 25px;

    font-size: 12px;

    color: var(--muted);
}

.typing-dots span {

    animation: blink 1.4s infinite both;

    margin-left: 2px;
}

.typing-dots span:nth-child(2) {
    animation-delay: .2s;
}

.typing-dots span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes blink {

    0%,80%,100% {
        opacity: .25;
    }

    40% {
        opacity: 1;
    }
}

/* =========================================
   INPUT
========================================= */

.composer {

    padding: 15px 20px;

    border-top: 1px solid var(--border);

    background: rgba(17,22,29,.95);
}

.replying {

    display: none;

    background: var(--panel-2);

    padding: 10px;

    border-radius: 10px;

    margin-bottom: 10px;

    border-left: 3px solid var(--primary);

    position: relative;
}

.replying.active {
    display: block;
}

.cancel-reply {

    position: absolute;

    right: 10px;
    top: 8px;

    background: none;

    border: none;

    color: var(--muted);

    cursor: pointer;
}

.composer-row {

    display: flex;

    align-items: flex-end;

    gap: 10px;
}

.composer-tools {

    display: flex;

    gap: 5px;
}

.message-input {

    flex: 1;

    background: var(--panel-2);

    border: 1px solid var(--border);

    border-radius: 14px;

    padding: 12px 14px;

    color: white;

    outline: none;

    resize: none;

    min-height: 46px;

    max-height: 140px;

    font-family: inherit;
}

.message-input:focus {
    border-color: rgba(79,140,255,.5);
}

.send-button {

    width: 48px;
    height: 46px;

    border-radius: 14px;

    border: none;

    background: var(--primary);

    color: white;

    cursor: pointer;

    font-size: 18px;

    transition: .2s;
}

.send-button:hover {
    background: var(--primary-dark);

    transform: translateY(-1px);
}

/* =========================================
   EMOJI
========================================= */

.emoji-picker {

    position: absolute;

    bottom: 80px;

    left: 20px;

    width: 300px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 15px;

    padding: 12px;

    display: none;

    box-shadow: var(--shadow);

    z-index: 50;
}

.emoji-picker.open {
    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    gap: 5px;
}

.emoji {

    border: none;

    background: transparent;

    font-size: 21px;

    cursor: pointer;

    padding: 5px;

    border-radius: 8px;
}

.emoji:hover {
    background: rgba(255,255,255,.08);
}

/* =========================================
   PROFILE PANEL
========================================= */

.info-panel {

    width: 0;

    overflow: hidden;

    background: var(--panel);

    border-left: 1px solid var(--border);

    transition: .3s;
}

.info-panel.open {
    width: 280px;
}

.info-content {
    width: 280px;
    padding: 30px 20px;
    text-align: center;
}

.profile-large {

    width: 80px;
    height: 80px;

    margin: auto;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;

    background:
        linear-gradient(
            135deg,
            #5f9cff,
            #7a4dff
        );
}

.info-name {
    margin-top: 15px;
    font-weight: 700;
}

.info-description {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
}

/* =========================================
   NOTIFICATION
========================================= */

.toast {

    position: fixed;

    right: 20px;

    bottom: 20px;

    background: var(--panel-3);

    border: 1px solid var(--border);

    padding: 12px 15px;

    border-radius: 12px;

    box-shadow: var(--shadow);

    transform: translateY(100px);

    opacity: 0;

    pointer-events: none;

    transition: .3s;

    z-index: 100;
}

.toast.show {

    transform: translateY(0);

    opacity: 1;
}

/* =========================================
   CONTEXT SEARCH
========================================= */

.search-results {

    position: absolute;

    top: 55px;
    left: 15px;

    width: 290px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 12px;

    box-shadow: var(--shadow);

    display: none;

    z-index: 100;
}

.search-results.active {
    display: block;
}

.search-result {

    padding: 10px;

    cursor: pointer;

    border-bottom: 1px solid var(--border);
}

.search-result:hover {
    background: rgba(255,255,255,.05);
}

.search-result small {
    color: var(--muted);
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:850px) {

    .sidebar {
        width: 250px;
    }

    .info-panel.open {
        display: none;
    }

    .message {
        max-width: 80%;
    }
}

@media(max-width:650px) {

    .sidebar {
        display: none;
    }

    .chat-header {
        padding: 0 12px;
    }

    .messages {
        padding: 15px;
    }

    .composer {
        padding: 10px;
    }

    .message {
        max-width: 88%;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- ====================================
         SIDEBAR
    ===================================== -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="logo">
                Chat System
            </div>

            <div class="online-status">
                <span class="online-dot"></span>
                Online
            </div>

        </div>


        <div class="search">

            <span class="search-icon">🔎</span>

            <input
                id="searchInput"
                type="text"
                placeholder="Buscar mensajes..."
            >

            <div
                id="searchResults"
                class="search-results">
            </div>

        </div>


        <!-- Cambiar usuario -->

        <div class="user-switcher">

            <select id="activeUser">

                <option value="A">
                    Persona A
                </option>

                <option value="B">
                    Persona B
                </option>

            </select>

        </div>


        <!-- Contact -->

        <div class="contact">

            <div class="avatar online">
                B
            </div>

            <div class="contact-info">

                <div class="contact-name">
                    Persona B
                </div>

                <div
                    class="contact-last"
                    id="lastMessage">
                    En línea
                </div>

            </div>

        </div>

    </aside>


    <!-- ====================================
         CHAT
    ===================================== -->

    <main class="chat">

        <!-- Header -->

        <header class="chat-header">

            <div class="chat-user">

                <div class="avatar online">
                    B
                </div>

                <div class="chat-user-info">

                    <h3>
                        Persona B
                    </h3>

                    <span id="status">
                        En línea
                    </span>

                </div>

            </div>


            <div class="header-actions">

                <button
                    class="icon-button"
                    onclick="toggleSearch()">
                    🔎
                </button>

                <button
                    class="icon-button"
                    onclick="toggleInfo()">
                    ℹ
                </button>

            </div>

        </header>


        <!-- Messages -->

        <section
            id="messages"
            class="messages">
        </section>


        <!-- Typing -->

        <div
            id="typing"
            class="typing">
        </div>


        <!-- Composer -->

        <section class="composer">

            <div
                id="replying"
                class="replying">

                <button
                    class="cancel-reply"
                    onclick="cancelReply()">
                    ✕
                </button>

                <div class="reply-author"
                     id="replyAuthor">
                </div>

                <div
                    class="reply-text"
                    id="replyText">
                </div>

            </div>


            <div class="composer-row">

                <div class="composer-tools">

                    <button
                        class="icon-button"
                        onclick="toggleEmoji()">
                        😊
                    </button>

                    <button
                        class="icon-button"
                        onclick="attachFile()">
                        📎
                    </button>

                </div>


                <textarea
                    id="messageInput"
                    class="message-input"
                    placeholder="Escribe un mensaje..."
                    rows="1">
                </textarea>


                <button
                    class="send-button"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </section>

    </main>


    <!-- ====================================
         INFO PANEL
    ===================================== -->

    <aside
        id="infoPanel"
        class="info-panel">

        <div class="info-content">

            <div class="profile-large">
                B
            </div>

            <div class="info-name">
                Persona B
            </div>

            <div class="info-description">
                Usuario de prueba
            </div>

            <br>

            <div
                style="color:#8d98a8;font-size:12px">

                Estado

            </div>

            <div style="margin-top:5px">
                🟢 En línea
            </div>

        </div>

    </aside>

</div>


<!-- Emoji picker -->

<div
    id="emojiPicker"
    class="emoji-picker">
</div>


<!-- Toast -->

<div
    id="toast"
    class="toast">
</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const USERS = {

    A: {
        name: "Persona A",
        avatar: "A"
    },

    B: {
        name: "Persona B",
        avatar: "B"
    }

};


/* =========================================================
   VARIABLES
========================================================= */

let activeUser = "A";

let messages = [];

let replyTo = null;

let editingMessage = null;

let typingTimer = null;


/* =========================================================
   EMOJIS
========================================================= */

const emojis = [

    "😀","😃","😄","😁",
    "😂","🤣","😊","😍",

    "😘","😎","🤩","🥳",
    "😢","😭","😡","😱",

    "👍","👎","❤️","🔥",
    "🎉","👏","🙏","💯",

    "✨","⭐","🚀","💀",
    "😈","🤔","😴","🤯",

    "✅","❌","⚡","💙",
    "💚","💛","🖤","🤍"

];


/* =========================================================
   DOM
========================================================= */

const messagesContainer =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const activeUserSelect =
    document.getElementById("activeUser");

const typingElement =
    document.getElementById("typing");


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadMessages();

        buildEmojiPicker();

        renderMessages();

        scrollToBottom();

    }
);


/* =========================================================
   USER SWITCH
========================================================= */

activeUserSelect.addEventListener(
    "change",
    e => {

        activeUser = e.target.value;

        updateChatHeader();

        renderMessages();

        scrollToBottom();

    }
);


/* =========================================================
   LOAD
========================================================= */

function loadMessages(){

    const saved =
        localStorage.getItem("advancedChat");

    if(saved){

        messages =
            JSON.parse(saved);

        return;
    }


    messages = [

        {
            id: crypto.randomUUID(),
            sender: "B",
            text: "¡Hola! 👋",
            time: new Date(
                Date.now() - 20 * 60000
            ).toISOString(),
            status: "read",
            reactions: {}
        },

        {
            id: crypto.randomUUID(),
            sender: "A",
            text: "Hola Persona B 😎",
            time: new Date(
                Date.now() - 19 * 60000
            ).toISOString(),
            status: "read",
            reactions: {}
        },

        {
            id: crypto.randomUUID(),
            sender: "B",
            text: "¿Cómo estás?",
            time: new Date(
                Date.now() - 18 * 60000
            ).toISOString(),
            status: "read",
            reactions: {}
        },

        {
            id: crypto.randomUUID(),
            sender: "A",
            text: "Todo excelente. Estoy probando este chat 🚀",
            time: new Date(
                Date.now() - 17 * 60000
            ).toISOString(),
            status: "read",
            reactions: {}
        }

    ];

    saveMessages();

}


/* =========================================================
   SAVE
========================================================= */

function saveMessages(){

    localStorage.setItem(
        "advancedChat",
        JSON.stringify(messages)
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    messagesContainer.innerHTML = "";

    if(messages.length === 0){

        messagesContainer.innerHTML = `
            <div style="
                text-align:center;
                margin:auto;
                color:#8d98a8;
            ">
                No hay mensajes todavía
            </div>
        `;

        return;
    }


    let previousDate = null;


    messages.forEach(message => {

        const date =
            new Date(message.time);

        const dateString =
            date.toLocaleDateString();


        if(dateString !== previousDate){

            const divider =
                document.createElement("div");

            divider.className =
                "date-divider";

            divider.innerHTML = `
                <span>
                    ${formatDate(date)}
                </span>
            `;

            messagesContainer.appendChild(divider);

            previousDate = dateString;
        }


        const isMe =
            message.sender === activeUser;


        const row =
            document.createElement("div");

        row.className =
            `message-row ${isMe ? "me" : "them"}`;


        const messageElement =
            document.createElement("div");

        messageElement.className =
            "message";


        let replyHTML = "";

        if(message.replyTo){

            const original =
                messages.find(
                    m => m.id === message.replyTo
                );

            if(original){

                replyHTML = `
                    <div class="reply-preview">

                        <div class="reply-author">
                            ${escapeHTML(
                                USERS[original.sender].name
                            )}
                        </div>

                        <div class="reply-text">
                            ${escapeHTML(
                                original.text
                            )}
                        </div>

                    </div>
                `;
            }

        }


        let reactionsHTML = "";

        if(message.reactions){

            const reactions =
                Object.entries(
                    message.reactions
                );

            if(reactions.length){

                reactionsHTML = `
                    <div style="
                        margin-top:5px;
                        display:flex;
                        gap:4px;
                        flex-wrap:wrap;
                    ">
                        ${reactions.map(
                            ([emoji,count]) =>
                                `<span style="
                                    background:rgba(0,0,0,.2);
                                    padding:2px 6px;
                                    border-radius:10px;
                                    font-size:11px;
                                ">
                                    ${emoji} ${count}
                                </span>`
                        ).join("")}
                    </div>
                `;
            }
        }


        const statusHTML =
            isMe
            ? `
                <span class="
                    read-status
                    ${message.status === "read"
                        ? "read"
                        : ""}
                ">
                    ${getStatusIcon(
                        message.status
                    )}
                </span>
              `
            : "";


        messageElement.innerHTML = `

            <div class="message-actions">

                <button
                    class="action"
                    title="Responder"
                    onclick="
                        prepareReply('${message.id}')
                    ">
                    ↩
                </button>

                <button
                    class="action"
                    title="Reaccionar"
                    onclick="
                        reactMessage(
                            '${message.id}',
                            '❤️'
                        )
                    ">
                    ❤️
                </button>

                ${
                    isMe
                    ? `
                        <button
                            class="action"
                            onclick="
                                editMessage(
                                    '${message.id}'
                                )
                            ">
                            ✏️
                        </button>

                        <button
                            class="action"
                            onclick="
                                deleteMessage(
                                    '${message.id}'
                                )
                            ">
                            🗑
                        </button>
                    `
                    : ""
                }

            </div>


            <div class="bubble">

                ${replyHTML}

                <div>
                    ${escapeHTML(message.text)}
                </div>

                ${reactionsHTML}

            </div>


            <div class="message-meta">

                ${formatTime(date)}

                ${statusHTML}

            </div>
        `;


        row.appendChild(messageElement);

        messagesContainer.appendChild(row);

    });


    markMessagesAsRead();

}


/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage(){

    const text =
        input.value.trim();

    if(!text)
        return;


    if(editingMessage){

        const message =
            messages.find(
                m => m.id === editingMessage
            );

        if(message){

            message.text = text;
            message.edited = true;

        }

        editingMessage = null;

        input.value = "";

        saveMessages();

        renderMessages();

        scrollToBottom();

        showToast("Mensaje editado");

        return;
    }


    const newMessage = {

        id: crypto.randomUUID(),

        sender: activeUser,

        text,

        time:
            new Date().toISOString(),

        status: "sending",

        reactions: {},

        replyTo:
            replyTo
            ? replyTo.id
            : null

    };


    messages.push(newMessage);

    input.value = "";

    cancelReply();

    saveMessages();

    renderMessages();

    scrollToBottom();


    /* Simular envío */

    setTimeout(() => {

        newMessage.status =
            "sent";

        saveMessages();

        renderMessages();

    }, 400);


    setTimeout(() => {

        newMessage.status =
            "delivered";

        saveMessages();

        renderMessages();

    }, 900);


    /* Simular respuesta */

    if(activeUser === "A"){

        simulateBotReply();

    }

}


/* =========================================================
   SIMULACIÓN PERSONA B
========================================================= */

function simulateBotReply(){

    clearTimeout(typingTimer);


    typingElement.innerHTML = `
        Persona B está escribiendo
        <span class="typing-dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </span>
    `;


    const responses = [

        "Perfecto 😎",

        "Jajaja, interesante 😂",

        "Estoy de acuerdo 👍",

        "Eso suena muy bien 🚀",

        "¿En serio?",

        "Cuéntame más 👀",

        "Me gusta esa idea 🔥",

        "Exactamente.",

        "Sí, podemos hacerlo.",

        "¡Genial! 🎉"

    ];


    const response =
        responses[
            Math.floor(
                Math.random() *
                responses.length
            )
        ];


    typingTimer = setTimeout(() => {

        typingElement.innerHTML = "";

        messages.push({

            id: crypto.randomUUID(),

            sender: "B",

            text: response,

            time:
                new Date().toISOString(),

            status: "read",

            reactions: {}

        });


        saveMessages();

        renderMessages();

        scrollToBottom();

        showToast("Persona B respondió");

    }, 1200);

}


/* =========================================================
   MARK READ
========================================================= */

function markMessagesAsRead(){

    messages.forEach(message => {

        if(
            message.sender !== activeUser &&
            message.status !== "read"
        ){

            message.status =
                "read";

        }

    });

    saveMessages();

}


/* =========================================================
   STATUS ICON
========================================================= */

function getStatusIcon(status){

    if(status === "sending")
        return "◷";

    if(status === "sent")
        return "✓";

    if(status === "delivered")
        return "✓✓";

    if(status === "read")
        return "✓✓";

    return "";

}


/* =========================================================
   REPLY
========================================================= */

function prepareReply(id){

    const message =
        messages.find(
            m => m.id === id
        );

    if(!message)
        return;


    replyTo = message;


    document.getElementById(
        "replyAuthor"
    ).textContent =
        USERS[message.sender].name;


    document.getElementById(
        "replyText"
    ).textContent =
        message.text;


    document.getElementById(
        "replying"
    ).classList.add("active");


    input.focus();

}


/* =========================================================
   CANCEL REPLY
========================================================= */

function cancelReply(){

    replyTo = null;

    document.getElementById(
        "replying"
    ).classList.remove("active");

}


/* =========================================================
   EDIT
========================================================= */

function editMessage(id){

    const message =
        messages.find(
            m => m.id === id
        );

    if(!message)
        return;


    editingMessage = id;

    input.value =
        message.text;

    input.focus();

}


/* =========================================================
   DELETE
========================================================= */

function deleteMessage(id){

    const index =
        messages.findIndex(
            m => m.id === id
        );

    if(index === -1)
        return;


    messages.splice(index,1);

    saveMessages();

    renderMessages();

    showToast(
        "Mensaje eliminado"
    );

}


/* =========================================================
   REACTION
========================================================= */

function reactMessage(id, emoji){

    const message =
        messages.find(
            m => m.id === id
        );

    if(!message)
        return;


    if(!message.reactions)
        message.reactions = {};


    if(!message.reactions[emoji]){

        message.reactions[emoji] = 1;

    } else {

        message.reactions[emoji]++;

    }


    saveMessages();

    renderMessages();

}


/* =========================================================
   EMOJI PICKER
========================================================= */

function buildEmojiPicker(){

    const picker =
        document.getElementById(
            "emojiPicker"
        );


    emojis.forEach(emoji => {

        const button =
            document.createElement("button");

        button.className =
            "emoji";

        button.textContent =
            emoji;


        button.onclick = () => {

            insertEmoji(emoji);

        };


        picker.appendChild(button);

    });

}


/* =========================================================
   TOGGLE EMOJI
========================================================= */

function toggleEmoji(){

    document
        .getElementById("emojiPicker")
        .classList.toggle("open");

}


/* =========================================================
   INSERT EMOJI
========================================================= */

function insertEmoji(emoji){

    const start =
        input.selectionStart;

    const end =
        input.selectionEnd;

    const text =
        input.value;


    input.value =
        text.substring(0,start)
        +
        emoji
        +
        text.substring(end);


    input.focus();

    input.selectionStart =
        input.selectionEnd =
        start + emoji.length;

}


/* =========================================================
   SEARCH
========================================================= */

function toggleSearch(){

    document
        .getElementById("searchInput")
        .focus();

}


/* Search event */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        e => {

            const query =
                e.target.value
                    .toLowerCase()
                    .trim();


            const resultBox =
                document.getElementById(
                    "searchResults"
                );


            if(!query){

                resultBox.classList.remove(
                    "active"
                );

                return;

            }


            const results =
                messages.filter(
                    message =>
                        message.text
                            .toLowerCase()
                            .includes(query)
                );


            resultBox.innerHTML = "";


            results.slice(0,10)
                .forEach(message => {

                    const result =
                        document.createElement(
                            "div"
                        );

                    result.className =
                        "search-result";


                    result.innerHTML = `

                        <strong>
                            ${USERS[
                                message.sender
                            ].name}
                        </strong>

                        <br>

                        <small>
                            ${escapeHTML(
                                message.text
                            )}
                        </small>

                    `;


                    result.onclick = () => {

                        scrollToMessage(
                            message.id
                        );

                    };


                    resultBox.appendChild(
                        result
                    );

                });


            resultBox.classList.add(
                "active"
            );

        }
    );


/* =========================================================
   SCROLL MESSAGE
========================================================= */

function scrollToMessage(id){

    const all =
        document.querySelectorAll(
            ".message-row"
        );


    const index =
        messages.findIndex(
            m => m.id === id
        );


    if(
        index >= 0 &&
        all[index]
    ){

        all[index].scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }

}


/* =========================================================
   INFO PANEL
========================================================= */

function toggleInfo(){

    document
        .getElementById("infoPanel")
        .classList.toggle("open");

}


/* =========================================================
   FILE ATTACHMENT
========================================================= */

function attachFile(){

    const inputFile =
        document.createElement(
            "input"
        );

    inputFile.type =
        "file";


    inputFile.onchange = e => {

        const file =
            e.target.files[0];

        if(!file)
            return;


        const message = {

            id:
                crypto.randomUUID(),

            sender:
                activeUser,

            text:
                `📎 Archivo adjunto: ${file.name}`,

            time:
                new Date().toISOString(),

            status:
                "delivered",

            reactions: {}

        };


        messages.push(message);

        saveMessages();

        renderMessages();

        scrollToBottom();

    };


    inputFile.click();

}


/* =========================================================
   KEYBOARD
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   INPUT AUTO RESIZE
========================================================= */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                140
            ) + "px";

    }
);


/* =========================================================
   UPDATE HEADER
========================================================= */

function updateChatHeader(){

    const otherUser =
        activeUser === "A"
        ? "B"
        : "A";


    document.querySelector(
        ".chat-user-info h3"
    ).textContent =
        USERS[otherUser].name;


    document.querySelector(
        ".chat-user .avatar"
    ).textContent =
        USERS[otherUser].avatar;


    document.querySelector(
        ".profile-large"
    ).textContent =
        USERS[otherUser].avatar;


    document.querySelector(
        ".info-name"
    ).textContent =
        USERS[otherUser].name;

}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom(){

    requestAnimationFrame(() => {

        messagesContainer.scrollTo({

            top:
                messagesContainer.scrollHeight,

            behavior:
                "smooth"

        });

    });

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(date){

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(date){

    const today =
        new Date();


    if(
        date.toDateString() ===
        today.toDateString()
    ){

        return "Hoy";

    }


    return date.toLocaleDateString(
        "es-ES",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(toastTimer);


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2000);

}


/* =========================================================
   DEMO: AUTO READ
========================================================= */

setInterval(() => {

    let changed = false;


    messages.forEach(message => {

        if(
            message.sender !== activeUser &&
            message.status !== "read"
        ){

            message.status = "read";

            changed = true;

        }

    });


    if(changed){

        saveMessages();

        renderMessages();

    }

},3000);


/* =========================================================
   DEMO: BÚSQUEDA FUERA
========================================================= */

document.addEventListener(
    "click",
    event => {

        const search =
            document.querySelector(
                ".search"
            );

        const results =
            document.getElementById(
                "searchResults"
            );


        if(
            !search.contains(event.target)
        ){

            results.classList.remove(
                "active"
            );

        }

    }
);


/* =========================================================
   DEMO: ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            document
                .getElementById(
                    "emojiPicker"
                )
                .classList.remove(
                    "open"
                );

            cancelReply();

        }

    }
);

</script>

</body>
</html>
