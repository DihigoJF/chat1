<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <div class="chat-icon"><i class="fas fa-comments"></i></div>
            <h1>Chat Online</h1>
            <p>Conéctate con otra persona en tiempo real</p>
            <div class="input-group">
                <label for="name-input">Escribe tu nombre</label>
                <input type="text" id="name-input" placeholder="Tu nombre..." maxlength="20">
                <button id="join-btn" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Entrar al chat</button>
                <div id="login-error" class="error-message"></div>
            </div>
        </div>
    </div>

    <div id="chat-screen" class="chat-screen" style="display:none;">
        <div class="chat-container">
            <header class="chat-header">
                <div class="header-left">
                    <h2><i class="fas fa-comment-dots"></i> Chat</h2>
                </div>
                <div class="header-right">
                    <span id="user-status" class="status"><i class="fas fa-circle"></i> Conectado</span>
                    <button id="leave-btn" class="btn-leave"><i class="fas fa-sign-out-alt"></i> Salir</button>
                </div>
            </header>
            <div class="users-panel">
                <div id="user-list" class="user-list"></div>
            </div>
            <div class="messages-area" id="messages-area"></div>
            <div id="typing-indicator" class="typing-indicator"></div>
            <div class="message-input-area">
                <textarea id="message-input" rows="1" placeholder="Escribe un mensaje... (Shift+Enter para salto de línea)"></textarea>
                <button id="send-btn" class="btn-send"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/js/connection.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
